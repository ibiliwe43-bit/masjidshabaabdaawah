<!DOCTYPE html>
<html lang="sw">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Audio Category</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}

.header{
background:#0a7d3b;
color:white;
padding:20px;
text-align:center;
}

.section{
padding:15px;
}

.audio-card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:8px;
}

audio{
width:100%;
}

</style>

</head>

<body>

<div class="header">
<h2 id="title">Audio</h2>
</div>

<div class="section" id="audioList"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyBrgOtZN04zoRlpDzOgHFlK_5HvJW6pxD0",
authDomain:"masjidshabaab.firebaseapp.com",
databaseURL:"https://masjidshabaab-default-rtdb.firebaseio.com/",
projectId:"masjidshabaab"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(window.location.search);
const type = params.get("type");

document.getElementById("title").innerText = type;

onValue(ref(db,"audios"), snapshot=>{

const container=document.getElementById("audioList");
container.innerHTML="";

snapshot.forEach(child=>{

const data=child.val();

if(data.category === type){

container.innerHTML+=`

<div class="audio-card">

<h3>${data.title}</h3>

<p>${data.description || ""}</p>

<audio controls src="${data.url}"></audio>

<br><br>

<a href="${data.url}" download>Download</a>

</div>

`;

}

});

});

</script>

</body>
</html>
