<!DOCTYPE html>
<html lang="sw">
<head>

<meta charset="UTF-8">
<title>Masjid Shabaab Daawah</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>Masjid Shabaab Daawah</h1>

<p>Karibu usikilize darsa na khutbah</p>

</header>


<section class="categories">

<button onclick="filterCategory('all')">Zote</button>

<button onclick="filterCategory('darsa')">Darsa</button>

<button onclick="filterCategory('jumaa')">Khutbah za Ijumaa</button>

<button onclick="filterCategory('eid')">Khutbah za Eid</button>

<button onclick="filterCategory('ramadhan')">Ramadhan</button>

</section>


<section id="audioList" class="audioList">

Loading...

</section>


<footer>

<p>© Masjid Shabaab Daawah</p>

</footer>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>


<script>

var firebaseConfig = {

apiKey:"AIzaSyBrgOtZN04zoRlpDzOgHFlK_5HvJW6pxD0",

authDomain:"masjidshabaab.firebaseapp.com",

databaseURL:"https://masjidshabaab-default-rtdb.firebaseio.com/",

projectId:"masjidshabaab"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

let audios=[];


db.ref("audios").on("value",snap=>{

const data=snap.val();

audios=[];

for(let id in data){

audios.push({id,...data[id]});

}

showAudios(audios);

});


function showAudios(list){

let html="";

list.forEach(a=>{

html+=`

<div class="audio">

<h3>${a.title}</h3>

<p>${a.desc}</p>

<audio controls>

<source src="${a.url}">

</audio>

</div>

`;

});

document.getElementById("audioList").innerHTML=html;

}


function filterCategory(cat){

if(cat==="all"){

showAudios(audios);

return;

}

let filtered=audios.filter(a=>a.category===cat);

showAudios(filtered);

}

</script>

</body>

</html>
