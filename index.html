<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Masjid Shabaab Daawah</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="header">
<h2>Masjid Shabaab Daawah</h2>
</div>

<div class="container">

<h3>Audio Zote</h3>

<div id="audioList">Loading...</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

var firebaseConfig = {

apiKey:"AIzaSyBrgOtZN04zoRlpDzOgHFlK_5HvJW6pxD0",
authDomain:"masjidshabaab.firebaseapp.com",
databaseURL:"https://masjidshabaab-default-rtdb.firebaseio.com/",
projectId:"masjidshabaab"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

db.ref("audios").on("value",snap=>{

const data=snap.val();

let html="";

if(!data){

html="Hakuna audio bado";

}else{

for(let id in data){

let a=data[id];

html+=`

<div class="audio">

<b>${a.title}</b>
<br>
${a.category}

<br><br>

<audio controls style="width:100%">
<source src="${a.url}">
</audio>

</div>

`;

}

}

document.getElementById("audioList").innerHTML=html;

});

</script>

</body>
</html>
