<!DOCTYPE html>
<html lang="sw">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
}

.header{
background:#0a7d3b;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:8px;
margin-bottom:15px;
}

button{
background:#0a7d3b;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#095f2d;
}

.audio-item{
background:#fff;
padding:15px;
border-radius:8px;
margin-bottom:10px;
border-left:5px solid #0a7d3b;
}

.actions button{
margin-right:10px;
}

.search{
width:100%;
padding:10px;
margin-bottom:15px;
}

</style>

</head>

<body>

<div class="header">

<h2>Masjid Admin Panel</h2>

<button onclick="logout()">Logout</button>

</div>

<div class="container">

<div class="card">

<h3>Upload Audio</h3>

<input type="text" id="title" placeholder="Jina la Audio">

<textarea id="description" placeholder="Maelezo"></textarea>

<select id="category">

<option value="darsa">Darsa za Jumamosi & Jumapili</option>
<option value="jumaa">Khutbah za Ijumaa</option>
<option value="eid">Khutbah za Eid</option>
<option value="ramadhan">Darsa za Ramadhani</option>

</select>

<input type="file" id="audioFile" accept="audio/*">

<button onclick="uploadAudio()">Save Audio</button>

</div>

<div class="card">

<h3>Audio Zote</h3>

<input class="search" type="text" id="search" placeholder="Tafuta audio..." onkeyup="searchAudio()">

<div id="audioList"></div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.0/firebase-app.js";

import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.2.0/firebase-database.js";

const firebaseConfig = {

apiKey:"AIzaSyBrgOtZN04zoRlpDzOgHFlK_5HvJW6pxD0",
authDomain:"masjidshabaab.firebaseapp.com",
databaseURL:"https://masjidshabaab-default-rtdb.firebaseio.com/",
projectId:"masjidshabaab"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let editingId=null;
let allAudios=[];

async function uploadAudio(){

const title=document.getElementById("title").value;
const description=document.getElementById("description").value;
const category=document.getElementById("category").value;
const file=document.getElementById("audioFile").files[0];

let audioURL="";

if(file){

const formData=new FormData();

formData.append("file",file);
formData.append("upload_preset","audio_upload");

const response=await fetch("https://api.cloudinary.com/v1_1/djfwodjwc/video/upload",{
method:"POST",
body:formData
});

const data=await response.json();

audioURL=data.secure_url;

}

if(editingId){

update(ref(db,"audios/"+editingId),{
title,
description,
category,
url:audioURL
});

editingId=null;

alert("Audio imehaririwa");

}else{

push(ref(db,"audios"),{
title,
description,
category,
url:audioURL
});

alert("Audio imeongezwa");

}

}

window.uploadAudio=uploadAudio;

onValue(ref(db,"audios"),snapshot=>{

allAudios=[];

snapshot.forEach(child=>{

allAudios.push({
id:child.key,
...child.val()
});

});

displayAudios(allAudios);

});

function displayAudios(list){

const container=document.getElementById("audioList");

container.innerHTML="";

list.forEach(audio=>{

container.innerHTML+=`

<div class="audio-item">

<b>${audio.title}</b>

<p>${audio.description || ""}</p>

<audio controls src="${audio.url}" style="width:100%"></audio>

<br><br>

<div class="actions">

<button onclick="editAudio('${audio.id}','${audio.title}','${audio.description}','${audio.category}')">
Edit
</button>

<button onclick="deleteAudio('${audio.id}')">
Delete
</button>

</div>

</div>

`;

});

}

function deleteAudio(id){

if(confirm("Unataka kufuta audio hii?")){

remove(ref(db,"audios/"+id));

}

}

window.deleteAudio=deleteAudio;

function editAudio(id,title,description,category){

document.getElementById("title").value=title;
document.getElementById("description").value=description;
document.getElementById("category").value=category;

editingId=id;

window.scrollTo(0,0);

}

window.editAudio=editAudio;

function searchAudio(){

const text=document.getElementById("search").value.toLowerCase();

const filtered=allAudios.filter(a=>a.title.toLowerCase().includes(text));

displayAudios(filtered);

}

window.searchAudio=searchAudio;

function logout(){

alert("Logout system utaongeza kwa login page");

}

window.logout=logout;

</script>

</body>
</html>
