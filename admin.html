<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Admin Panel</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="header">
<h2>Admin Panel</h2>
</div>

<div class="container">

<div class="card">

<h3>Upload Audio</h3>

Jina la Audio
<input id="title">

Maelezo
<textarea id="desc"></textarea>

Category
<select id="category">

<option value="darsa">Darsa</option>
<option value="jumaa">Khutbah za Ijumaa</option>
<option value="eid">Khutbah za Eid</option>
<option value="ramadhan">Ramadhan</option>

</select>

Audio
<input type="file" id="file">

<button onclick="upload()">Upload</button>

</div>

<div class="card">

<h3>Audio Zote</h3>

<div id="audioList"></div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

var firebaseConfig = {

apiKey:"AIzaSyBrgOtZN04zoRlpDzOgHFlK_5HvJW6pxD0",
authDomain:"masjidshabaab.firebaseapp.com",
databaseURL:"https://masjidshabaab-default-rtdb.firebaseio.com/",
projectId:"masjidshabaab"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

function upload(){

const title=document.getElementById("title").value;
const desc=document.getElementById("desc").value;
const category=document.getElementById("category").value;

const file=document.getElementById("file").files[0];

const reader=new FileReader();

reader.onload=function(){

db.ref("audios").push({

title:title,
desc:desc,
category:category,
url:reader.result

});

alert("Audio uploaded");

}

reader.readAsDataURL(file);

}

db.ref("audios").on("value",snap=>{

const data=snap.val();

let html="";

if(!data){

html="Hakuna audio bado";

}else{

for(let id in data){

let a=data[id];

html+=`

<div class="audio">

<b>${a.title}</b>
<br>

<button onclick="deleteAudio('${id}')">
Delete
</button>

</div>

`;

}

}

document.getElementById("audioList").innerHTML=html;

});

function deleteAudio(id){

if(confirm("Futa audio hii?")){

db.ref("audios/"+id).remove();

}

}

</script>

</body>
</html>
